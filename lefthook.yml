pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.swift"
      run: swiftformat {staged_files}
      stage_fixed: true
    lint:
      glob: "*.swift"
      run: swiftlint lint --quiet --strict {staged_files}
    file-length:
      glob: "*.swift"
      run: ./scripts/check-file-length.sh {staged_files}
    test:
      glob: "*.swift"
      run: ./scripts/test.sh
